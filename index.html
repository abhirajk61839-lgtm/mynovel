<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovelVerse</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f14;
  color:white;
}

header{
  padding:20px;
  background:#161622;
  text-align:center;
  font-size:28px;
  font-weight:bold;
}

.hero{
  padding:25px;
  text-align:center;
}

.hero h1{
  font-size:32px;
}

.card{
  background:#1d1d2b;
  margin:15px;
  padding:15px;
  border-radius:15px;
}

button{
  background:#6c5ce7;
  color:white;
  border:none;
  padding:10px 20px;
  border-radius:20px;
}

footer{
  text-align:center;
  padding:20px;
  opacity:.7;
}
</style>

</head>

<body>

<header>
📖 NovelVerse
</header>

<section class="hero">
<h1>Read Amazing Stories</h1>
<p>Fantasy • Isekai • Adventure Novels</p>
</section>


<div class="card">
<h2>⚔️ The New World Hero</h2>
<p>A young boy enters a mysterious world and discovers hidden powers.</p>
<button>Read Now</button>
</div>


<div class="card">
<h2>🔥 The Last Kingdom</h2>
<p>A legendary warrior fights to save his lost kingdom.</p>
<button>Read Now</button>
</div>


<footer>
© 2026 NovelVerse
</footer>

</html>
