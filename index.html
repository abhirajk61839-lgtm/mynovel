<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovelVerse</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#09090f;
color:#fff;
}

header{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px;
background:rgba(0,0,0,.5);
backdrop-filter:blur(15px);
z-index:1000;
}

.logo{
font-size:28px;
font-weight:700;
color:#8b5cff;
}

.search{
background:#1c1c2b;
border:none;
color:#fff;
padding:10px 16px;
border-radius:30px;
width:150px;
}

.hero{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

text-align:center;

padding:20px;

background:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.7)),
url("https://images.unsplash.com/photo-1518709268805-4e9042af2176?auto=format&fit=crop&w=1400&q=80");

background-size:cover;

background-position:center;

}

.hero h1{

font-size:55px;

}

.hero p{

margin-top:20px;

font-size:18px;

opacity:.9;

}

.btn{

margin-top:30px;

padding:15px 40px;

background:#8b5cff;

border:none;

color:white;

border-radius:35px;

font-size:18px;

}

.section{

padding:35px 18px;

}

.section h2{

margin-bottom:20px;

}

.cards{

display:flex;

overflow:auto;

gap:15px;

}

.card{

min-width:170px;

background:#171726;

border-radius:18px;

overflow:hidden;

}

.card img{

width:100%;

height:220px;

object-fit:cover;

}

.card h3{

padding:10px;

font-size:18px;

}

.card p{

padding:0 10px 15px;

opacity:.8;

font-size:14px;

}

</style>

</head>

<body>

<header>

<div class="logo">📖 NovelVerse</div>

<input class="search" placeholder="Search">

</header>

<section class="hero">

<div>

<h1>Read The Future Of Novels</h1>

<p>Fantasy • Action • Romance • Isekai</p>

<button class="btn">Start Reading</button>

</div>

</section>

<section class="section">

<h2>🔥 Trending Novels</h2>

<div class="cards">

<div class="card">

<img src="https://picsum.photos/300/420?1">

<h3>Shadow Hero</h3>

<p>⭐4.9 • 3.2M Views</p>

</div>

<div class="card">

<img src="https://picsum.photos/300/420?2">

<h3>Dragon King</h3>

<p>⭐4.8 • 2.8M Views</p>

</div>

<div class="card">

<img src="https://picsum.photos/300/420?3">

<h3>The Mage</h3>

<p>⭐4.7 • 1.9M Views</p>

</div>

</div>

</section>

</body>
</html>
